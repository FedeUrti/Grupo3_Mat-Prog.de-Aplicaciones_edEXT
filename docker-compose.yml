services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: edext_db
      MYSQL_USER: edext_user
      MYSQL_PASSWORD: edext_pass
    ports:
      - "127.0.0.1:${COMPOSE_DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "127.0.0.1:${COMPOSE_PHPMYADMIN_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

  central:
    build:
      context: .
      dockerfile: Dockerfile.central
    environment:
      EDEXT_SOAP_BIND_ADDRESS: "http://0.0.0.0:9128/edext/soap"
      EDEXT_JDBC_URL: "jdbc:mysql://db:3306/edext_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
      EDEXT_JDBC_USER: edext_user
      EDEXT_JDBC_PASSWORD: edext_pass
      EDEXT_HBM2DDL_AUTO: "update"
    ports:
      - "127.0.0.1:${COMPOSE_CENTRAL_PORT:-9128}:9128"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:${COMPOSE_WEB_PORT:-8081}:8080"
    environment:
      EDEXT_SOAP_BASE_URL: "http://central:9128/edext/soap"
      EDEXT_UPLOAD_DIR: /usr/local/tomcat/uploads
    volumes:
      - course_uploads:/usr/local/tomcat/uploads
    depends_on:
      db:
        condition: service_healthy
      central:
        condition: service_started

volumes:
  mysql_data:
  course_uploads:
